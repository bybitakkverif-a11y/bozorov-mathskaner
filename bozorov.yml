name: Bozorov OMR Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Python 3.12 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter o'rnatish
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Yangi Flet (0.25.2) va Pypng o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.25.2 pypng --extra-index-url https://pypi.flet.dev

      - name: Talablarni avto-to'g'rilash
        run: |
          rm -f pyproject.toml requirements.txt
          echo "flet==0.25.2" > requirements.txt
          echo "pypng" >> requirements.txt

      - name: Android litsenziyalarini qabul qilish
        run: yes | flutter doctor --android-licenses || true

      - name: APK YIG'ISH
        run: flet build apk --org uz.bozorovmath --project "Bozorov OMR"

      - name: Tayyor APK ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: Bozorov-Tayyor-APK
          path: build/**/*.apk
