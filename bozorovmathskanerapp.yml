name: Build Bozorov OMR APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable

      - name: Install Flet CLI
        run: python -m pip install --upgrade pip && pip install flet==0.24.1 pypng

      - name: Prepare requirements
        run: rm -f pyproject.toml && printf 'flet==0.24.1\npypng\n' > requirements.txt

      - name: Patch wakelock_plus
        run: flutter pub cache add wakelock_plus --version 1.4.0 && F="$PUB_CACHE/hosted/pub.dev/wakelock_plus-1.4.0/android/build.gradle" && sed -i 's/flutter\.compileSdkVersion/34/g;s/flutter\.minSdkVersion/21/g;s/flutter\.targetSdkVersion/34/g' "$F" && cat "$F"

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK
        run: flet build apk --module-name main --org uz.bozorovmath --project "Bozorov OMR" --description "Bozorov Math Milliy Sertifikat Skaneri"

      - name: Locate APK
        run: find build -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bozorov-OMR-APK
          path: build/**/*.apk
          if-no-files-found: error