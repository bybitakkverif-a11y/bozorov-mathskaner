name: Toza Bozorov APK Yig'uvchi

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter o'rnatish (Qat'iy 3.19.6)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: stable

      - name: Flet va Pypng o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1 pypng

      - name: Litsenziyalarni tasdiqlash
        run: yes | flutter doctor --android-licenses || true

      - name: APK yig'ishni boshlash
        run: flet build apk --module-name main --org uz.bozorovmath --project "Bozorov OMR" --description "Bozorov_OMR"

      - name: Tayyor APK ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: Bozorov-Tayyor-APK
          path: build/**/*.apk
          if-no-files-found: error
