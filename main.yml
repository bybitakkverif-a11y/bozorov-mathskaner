name: Build Bozorov OMR APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (Majburiy 3.19.6)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: stable

      - name: Install Flet CLI va pypng
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1 pypng

      - name: Talablarni avto-tozalash
        run: |
          rm -f pyproject.toml
          echo "flet==0.24.1" > requirements.txt
          echo "pypng" >> requirements.txt

      - name: Litsenziyalarni qabul qilish
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Build APK
        run: |
          flet build apk \
            --module-name main \
            --org uz.bozorovmath \
            --project "Bozorov OMR" \
            --description "Bozorov Math Milliy Sertifikat Skaneri"

      - name: Locate APK
        run: |
          find build -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bozorov-OMR-APK
          path: build/**/*.apk
          if-no-files-found: error
