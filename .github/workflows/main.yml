```yaml
name: Build Bozorov OMR APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable

      - name: Install Linux toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libstdc++-12-dev

      - name: Verify project files
        run: |
          ls -la
          test -f main.py
          test -f requirements.txt
          test -f pyproject.toml
          flutter --version
          java -version

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1

      - name: Check package versions
        run: |
          python -m pip install \
            numpy==1.26.4 \
            opencv-python==4.10.0.84
          python -c "import numpy, cv2; print('NumPy:', numpy.__version__); print('OpenCV:', cv2.__version__)"

      - name: Accept Android licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Check Flutter Android toolchain
        run: flutter doctor -v || true

      - name: Build APK
        run: |
          flet build apk \
            --module-name main \
            --org uz.bozorovmath \
            --project "Bozorov OMR" \
            --description "Bozorov Math Milliy Sertifikat Skaneri"

      - name: Locate APK
        run: |
          find build -type f -name "*.apk" -print
          test -n "$(find build -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bozorov-OMR-APK
          path: build/**/*.apk
          if-no-files-found: error
```
